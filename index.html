<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Макет А4 для печати фото</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#dfe2e7;--bar:#fff;--ink:#16181d;--mut:#6a7080;--line:#d3d7de;--acc:#4f46e5;--accink:#fff;--field:#f1f3f6;--bad:#d4264a;--hs:26;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--bar:#1d1f24;--ink:#eceef2;--mut:#9aa0ad;--line:#30343c;--acc:#8f8cff;--accink:#10102a;--field:#272a31;--bad:#ff6b88;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--bar:#1d1f24;--ink:#eceef2;--mut:#9aa0ad;--line:#30343c;--acc:#8f8cff;--accink:#10102a;--field:#272a31;--bad:#ff6b88;color-scheme:dark}
@media (pointer:coarse){:root{--hs:44}}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.b{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none}
@media (pointer:coarse){.b{height:42px;min-width:42px}}
.b:hover{border-color:var(--acc)}.b:disabled{opacity:.38;pointer-events:none}
.b.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
.b.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.b.bad{color:var(--bad)}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#pages{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto}
.zc{display:flex;align-items:center;gap:4px;color:var(--mut)}#zl{min-width:44px;text-align:center}
@media (max-width:760px){.zc,.hs{display:none}}
@media (max-width:560px){#pages{order:10;flex:1 0 100%}}
#stage{position:relative;flex:1;min-height:0}
#view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--k:1}
#page{position:relative;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.3)}
.mg{position:absolute;border:calc(var(--k)*1px) dashed #e0506a;opacity:.55;pointer-events:none}
.gl{position:absolute;background:#ff3d71;pointer-events:none;z-index:99999}
.it{position:absolute;cursor:move;touch-action:none}.it.lk{cursor:default}
.it.sel{outline:calc(var(--k)*2px) solid var(--acc)}.it.sel.lk{outline-style:dashed}
.clip{position:absolute;inset:0;overflow:hidden}
.clip img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.h{display:none;position:absolute;touch-action:none;z-index:3}
.sel:not(.lk)>.h{display:block}
.c{width:calc(var(--k)*var(--hs)*1px);height:calc(var(--k)*var(--hs)*1px);transform:translate(-50%,-50%)}
.c::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--k)*14px);height:calc(var(--k)*14px);transform:translate(-50%,-50%);background:#fff;border:calc(var(--k)*2px) solid var(--acc);border-radius:50%;box-sizing:border-box}
.c.nw{left:0;top:0;cursor:nwse-resize}.c.se{left:100%;top:100%;cursor:nwse-resize}.c.ne{left:100%;top:0;cursor:nesw-resize}.c.sw{left:0;top:100%;cursor:nesw-resize}
.g{transform:translate(-50%,-50%)}
.g.n,.g.s{left:50%;width:min(60%,calc(var(--k)*var(--hs)*2px));height:calc(var(--k)*var(--hs)*1px);cursor:ns-resize}
.g.n{top:0}.g.s{top:100%}
.g.e,.g.w{top:50%;height:min(60%,calc(var(--k)*var(--hs)*2px));width:calc(var(--k)*var(--hs)*1px);cursor:ew-resize}
.g.e{left:100%}.g.w{left:0}
.g::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--acc);border:calc(var(--k)*1.5px) solid #fff;border-radius:99px;box-sizing:border-box}
.g.n::after,.g.s::after{width:calc(var(--k)*26px);height:calc(var(--k)*9px)}
.g.e::after,.g.w::after{width:calc(var(--k)*9px);height:calc(var(--k)*26px)}
.r{left:50%;top:calc(var(--k)*(var(--hs) + 10)*-1px);width:calc(var(--k)*var(--hs)*1px);height:calc(var(--k)*var(--hs)*1px);transform:translate(-50%,-50%);cursor:grab}
.r::after{content:"↻";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--k)*26px);height:calc(var(--k)*26px);line-height:calc(var(--k)*26px);font-size:calc(var(--k)*16px);text-align:center;background:var(--acc);color:var(--accink);border-radius:50%}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,80%);padding:28px 18px;border:2px dashed var(--mut);border-radius:16px;background:var(--bar);text-align:center;cursor:pointer;color:var(--mut)}
#empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
#drop{position:absolute;inset:8px;border:3px dashed var(--acc);border-radius:16px;background:color-mix(in srgb,var(--acc) 14%,transparent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;pointer-events:none;z-index:30}
.pop{position:fixed;z-index:20;display:flex;gap:6px;padding:6px;background:var(--bar);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#sel{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 20px);overflow-x:auto}
#sizes{left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:min(360px,calc(100% - 20px));flex-wrap:wrap}
#menu{right:10px;top:calc(56px + env(safe-area-inset-top,0px));flex-direction:column;width:min(270px,calc(100% - 20px));padding:12px;gap:8px}
#menu label{display:flex;gap:8px;align-items:center}#menu input[type=number]{width:64px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#menu p{margin:0;color:var(--mut);font-size:12px}
.vr{width:1px;background:var(--line);margin:4px 2px;flex:none}
#toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--ink);color:var(--bar);border-radius:12px;max-width:calc(100% - 20px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast .b{height:32px;background:transparent;color:inherit;border-color:currentColor}
.tb{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.2;min-height:1.2em;pointer-events:none;user-select:none}
.tx .g.n,.tx .g.s{display:none!important}
#tx{left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 20px));box-sizing:border-box;flex-direction:column}
#tx textarea{width:100%;box-sizing:border-box;resize:none;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px}
#tx textarea:disabled{opacity:.5}
.tr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tadv{display:grid;grid-template-columns:auto 1fr 46px;gap:6px 10px;align-items:center;width:100%}
#tadv label{display:contents}#tadv label>span{font-size:13px;color:var(--mut)}
#tadv input[type=range]{width:100%;min-width:0;margin:0;accent-color:var(--acc)}
#tadv output{font-size:12px;text-align:right;color:var(--ink)}
#tadv .b{grid-column:1/-1;height:32px}
#tfont{flex:1 1 130px;min-width:0;justify-content:flex-start;overflow:hidden;white-space:nowrap;font-size:16px}
#tcol{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--field);flex:none}
@media (pointer:coarse){#tcol{height:42px}}
#tsz{width:58px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px}
#tx .u{color:var(--mut);font-size:12px}
#fonts{left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 20px));max-height:min(55vh,440px);overflow-y:auto;flex-direction:column;gap:3px;box-sizing:border-box;z-index:25}
#ratios{left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 20px));box-sizing:border-box;flex-direction:column;gap:8px}
#ratios .tr .b{flex:1 1 60px}
#ratios .tr .lb{color:var(--mut);font-size:12px}
#ratios input{width:56px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.multi .h{display:none!important}
.nb{display:none;position:absolute;left:0;top:0;z-index:4;pointer-events:none;box-sizing:border-box;min-width:calc(var(--k)*24px);height:calc(var(--k)*24px);padding:0 calc(var(--k)*6px);border-radius:99px;background:#fff;color:var(--acc);border:calc(var(--k)*2px) solid var(--acc);font-weight:700;font-size:calc(var(--k)*13px);line-height:calc(var(--k)*20px);text-align:center;white-space:nowrap;transform:translate(-30%,-30%) rotate(var(--rr,0deg))}
.nb.last{background:var(--acc);color:var(--accink)}
.multi .sel>.nb{display:block}
#cnt{align-self:center;color:var(--mut);font-size:12px;white-space:nowrap;padding:0 4px;flex:none}
#fonts .gt{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:8px 6px 2px}
#fonts .b{justify-content:flex-start;font-size:19px;height:auto;min-height:40px;padding:4px 10px;width:100%;text-align:left}

<div id="app">
<header>
  <button class="b pri" id="add" data-i="plus" aria-label="Добавить фото">Фото</button>
  <button class="b" id="addt" data-i="text" aria-label="Добавить текст">Текст</button>
  <button class="b" id="un" data-i="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить"></button>
  <button class="b" id="re" data-i="redo" title="Вернуть (Ctrl+Shift+Z)" aria-label="Вернуть"></button>
  <nav id="pages"></nav>
  <span class="zc"><button class="b" id="zm" aria-label="Уменьшить">−</button><span id="zl"></span><button class="b" id="zp" aria-label="Увеличить">+</button></span>
  <button class="b" id="zf" data-i="fit" title="Показать весь лист" aria-label="Показать весь лист"></button>
  <button class="b" id="gear" data-i="sliders" title="Настройки" aria-label="Настройки"></button>
  <button class="b pri" id="pdf" data-i="down"><span class="hs">Скачать&nbsp;</span>PDF</button>
</header>
<div id="stage">
  <div id="view"><div id="world"><div id="page"></div></div></div>
  <div id="empty"><b>Добавить фото</b>Нажмите, чтобы выбрать, или перетащите файлы сюда. Можно вставить из буфера (Ctrl+V).</div>
  <div id="drop" hidden>Отпустите, чтобы добавить на лист</div>
</div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div id="sizes" class="pop" hidden></div>
<div id="tx" class="pop" hidden>
  <textarea id="ttxt" rows="2" placeholder="Введите текст" aria-label="Текст"></textarea>
  <div class="tr">
    <button class="b" id="tfont" title="Выбрать шрифт">Шрифт</button>
    <button class="b" id="tbd" title="Жирный" aria-label="Жирный"><b>B</b></button>
    <button class="b" id="tit" title="Курсив" aria-label="Курсив"><i>I</i></button>
    <button class="b" id="tal" title="Выравнивание" aria-label="Выравнивание"></button>
    <input type="color" id="tcol" title="Цвет" aria-label="Цвет">
    <input type="number" id="tsz" min="4" max="400" step="1" title="Размер, pt" aria-label="Размер в пунктах"><span class="u">pt</span>
    <button class="b" id="tadvb" title="Интервалы и растяжение" aria-label="Интервалы и растяжение">A↔</button>
  </div>
  <div id="tadv" hidden>
    <label><span>Буквы</span><input type="range" id="rls" min="-10" max="100" step="1"><output id="vls"></output></label>
    <label><span>Слова</span><input type="range" id="rws" min="-50" max="300" step="5"><output id="vws"></output></label>
    <label><span>Строки</span><input type="range" id="rlh" min="60" max="250" step="5"><output id="vlh"></output></label>
    <label><span>Ширина</span><input type="range" id="rsx" min="40" max="250" step="1"><output id="vsx"></output></label>
    <button class="b" id="trs">Сбросить интервалы</button>
  </div>
</div>
<div id="ratios" class="pop" hidden>
  <div class="tr">
    <button class="b" id="oL" data-i="land">Горизонтально</button>
    <button class="b" id="oP" data-i="port">Вертикально</button>
  </div>
  <div class="tr" id="rbtns"></div>
  <div class="tr"><span class="lb">Свои:</span><input id="ra" inputmode="decimal" placeholder="16" aria-label="Ширина пропорции"><span class="lb">:</span><input id="rb" inputmode="decimal" placeholder="10" aria-label="Высота пропорции"><button class="b pri" id="rok">Применить</button></div>
</div>
<div id="fonts" class="pop" hidden></div>
<div id="sel" class="pop" hidden>
  <button class="b" id="mu" title="Выделять несколько фото по очереди (или Shift/Ctrl + клик)">Несколько</button>
  <span id="cnt" hidden></span>
  <button class="b pri" id="lr" data-i="row" hidden title="Ровно разложить между первым и последним фото (Q)">Выровнять</button>
  <button class="b pri" id="cl" data-i="grid" hidden title="Собрать выделенные фото в макет коллажа (W)">Коллаж</button>
  <i class="vr"></i>
  <button class="b" id="rl" data-i="rotl" title="Повернуть на 90° влево" aria-label="Повернуть влево"></button>
  <button class="b" id="rr" data-i="rotr" title="Повернуть на 90° вправо" aria-label="Повернуть вправо"></button>
  <i class="vr"></i>
  <button class="b" id="sz" title="Размер в сантиметрах">Размер</button>
  <button class="b" id="ar" title="Пропорции кадра: 4:3, 16:9, A4…">Пропорции</button>
  <button class="b" id="fr" title="Вернуть кадр целиком">Весь кадр</button>
  <i class="vr"></i>
  <button class="b" id="cp" data-i="copy" title="Копия (Ctrl+D)" aria-label="Копия"></button>
  <button class="b" id="lk" title="Закрепить: защита от случайных изменений" aria-label="Закрепить"></button>
  <button class="b bad" id="dl" data-i="trash" title="Удалить" aria-label="Удалить"></button>
</div>
<div id="menu" class="pop" hidden>
  <label><input type="checkbox" id="o_snap" checked> Прилипание к краям и полям</label>
  <label><input type="checkbox" id="o_grid"> Сетка 1 см</label>
  <label>Поля, мм <input type="number" id="o_margin" value="10" min="0" max="50"></label>
  <button class="b bad" id="dp">Удалить страницу</button>
  <p>Углы — размер. Середина ребра — обрезка. Кружок сверху — поворот. Замок защищает фото от случайных изменений. Alt отключает прилипание.</p>
</div>

function addFiles(fs,at){
  const L=[...fs].filter(f=>f.type.startsWith('image/'));
  if(!L.length){toast('Выберите файлы-изображения');return}
  L.forEach((f,n)=>{
    const src=URL.createObjectURL(f),im=new Image();
    im.onerror=()=>toast('Не удалось открыть '+f.name);
    im.onload=()=>{
      preview(im,src,f.type).then(ps=>{const a=++aid;assets[a]={src:ps,im};
      const m=st.margin,r=im.naturalWidth/im.naturalHeight;
      let W=Math.min(100,PW-2*m),H=W/r;if(H>PH-2*m){H=Math.min(PH-2*m,100);W=H*r}
      const o=(P().items.length%6)*6-15;
      act(()=>{const it={id:++uid,a,x:at?at.x+n*6:PW/2+o,y:at?at.y+n*6:PH/2+o,W,H,cl:0,ct:0,cr:0,cb:0,rot:0,lock:false};P().items.push(it);draw();select(it)});
    });};
    im.src=src;
  });
}
$('add').onclick=$('empty').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))$('drop').hidden=false});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('drop').hidden=true});
addEventListener('drop',e=>{
  e.preventDefault();$('drop').hidden=true;const r=pg.getBoundingClientRect(),s=V.z*B;
  addFiles(e.dataTransfer.files,{x:Math.min(PW-20,Math.max(20,(e.clientX-r.left)/s)),y:Math.min(PH-20,Math.max(20,(e.clientY-r.top)/s))});
});
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length)addFiles(f)});

/* действия над фото */
const mine=()=>ms.filter(i=>!i.lock),minePh=()=>ms.filter(i=>!i.t&&!i.lock),refPh=()=>[...ms].reverse().find(i=>!i.t);
function fitExact(it,tw,th){const r=assets[it.a].im.naturalWidth/assets[it.a].im.naturalHeight;let W=tw,H=tw/r;if(H<th){H=th;W=th*r}
  it.W=W;it.H=H;it.cl=it.cr=(W-tw)/2;it.ct=it.cb=(H-th)/2;place(it)}
function rot(d){const L=mine();if(L.length)act(()=>L.forEach(i=>{i.rot=((i.rot+d)%360+360)%360;place(i)}))}
$('rl').onclick=()=>rot(-90);$('rr').onclick=()=>rot(90);
$('fr').onclick=()=>{const L=minePh();if(L.length)act(()=>L.forEach(i=>{i.cl=i.ct=i.cr=i.cb=0;place(i)}))};
function dup(){if(!ms.length)return;act(()=>{const cs=ms.map(({el,...r})=>({...r,id:++uid,x:r.x+6,y:r.y+6,lock:false}));cs.forEach(c=>P().items.push(c));draw();setMs(cs)})}
$('cp').onclick=dup;
$('lk').onclick=()=>{if(sel){const v=!sel.lock;act(()=>{ms.forEach(i=>{i.lock=v;place(i)});ui()})}};
function del(){const L=mine();if(!L.length)return;const msg=L.length>1?'Удалено: '+L.length:(L[0].t?'Текст удалён':'Фото удалено');act(()=>{P().items=P().items.filter(i=>!L.includes(i));draw()});toast(msg,'Вернуть',undo)}
$('dl').onclick=del;
$('mu').onclick=()=>{multi=!multi;ui();if(multi)toast('Нажимайте на фото, чтобы добавлять и убирать их из выделения')};
/* выстроить выделенные в линию: порядок — по номерам, линия проходит через последнее выделенное */
function lineUp(){
  const n=ms.length;
  if(n<3){toast('Выделите минимум три фото: первое и последнее остаются на месте, остальные встанут между ними');return}
  const A=ms[0],Z=ms[n-1],vert=Math.abs(Z.y-A.y)>Math.abs(Z.x-A.x);
  const ax=vert?'y':'x',ay=vert?'x':'y',hk=vert?'hh':'hw',d=Z[ax]-A[ax];
  if(Math.abs(d)<1){toast('Первое и последнее фото стоят в одном месте — раздвиньте их');return}
  const s=d>0?1:-1,mid=ms.slice(1,-1),sz=mid.map(i=>2*aabb(i)[hk]);
  const gap=(s*d-aabb(A)[hk]-aabb(Z)[hk]-sz.reduce((a,b)=>a+b,0))/(n-1);
  act(()=>{let c=A[ax]+s*aabb(A)[hk];
    mid.forEach((i,k)=>{c+=s*gap;const p=c+s*sz[k]/2;c+=s*sz[k];
      if(!i.lock){i[ax]=p;i[ay]=A[ay]+(p-A[ax])/d*(Z[ay]-A[ay]);place(i)}})});
  if(gap<0)toast('Фото накладываются друг на друга — раздвиньте первое и последнее');
}
$('lr').onclick=lineUp;$('cl').onclick=collage;

const RT=[['1:1',1],['5:4',5/4],['4:3',4/3],['3:2',3/2],['16:10',1.6],['16:9',16/9],['21:9',21/9],['A4',Math.SQRT2],['3:1',3]];
const swp=it=>Math.round(it.rot/90)%2!==0;
const vland=it=>(bw(it)>=bh(it))!==swp(it);
const frameQ=it=>{const w=bw(it),h=bh(it);return Math.max(w,h)/Math.min(w,h)};
/* q>=1: длинная сторона к короткой; land: кадр горизонтальный на листе. Кадр вырезается по центру целого снимка, площадь сохраняется */
function setFrame(it,q,land,AA){
  const a=(land!==swp(it))?q:1/q,W=it.W,H=it.H,A0=AA||bw(it)*bh(it);
  let fw,fh;if(W/H>a){fh=H;fw=H*a}else{fw=W;fh=W/a}
  const m=st.margin,e=aw(fw,fh,it.rot);
  let s=Math.sqrt(A0/(fw*fh));
  s=Math.min(s,(PW-2*m)/(2*e.hw),(PH-2*m)/(2*e.hh));s=Math.max(s,10/Math.min(fw,fh));
  it.cl=it.cr=(W-fw)/2*s;it.ct=it.cb=(H-fh)/2*s;it.W=W*s;it.H=H*s;
  const e2=aw(fw*s,fh*s,it.rot);it.x=Math.min(Math.max(it.x,e2.hw),PW-e2.hw);it.y=Math.min(Math.max(it.y,e2.hh),PH-e2.hh);
  place(it);
}

addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key,mod=e.ctrlKey||e.metaKey,l=k.toLowerCase();
  if(mod&&l==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&l==='y'){e.preventDefault();redo();return}
  if(mod&&l==='d'){e.preventDefault();dup();return}
  if(mod&&e.code==='KeyA'){e.preventDefault();setMs(P().items.slice());return}
  if(mod)return;
  if(e.code==='KeyQ'){e.preventDefault();lineUp();return}
  if(e.code==='KeyW'){e.preventDefault();collage();return}
  if(k==='Escape'){select(null);return}
  if(k==='+'||k==='='){zoomAt(1.2,vw()/2,vh()/2);return}
  if(k==='-'){zoomAt(1/1.2,vw()/2,vh()/2);return}
  if(k==='0'){fit();return}
  if(!mine().length)return;
  if(k==='Delete'){e.preventDefault();del();return}
  const s=e.shiftKey?5:.5,m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[k];
  if(m){e.preventDefault();const L=mine();act(()=>L.forEach(i=>{i.x+=m[0];i.y+=m[1];place(i)}))}
});

/* PDF: каждая страница рисуется целиком в 300 dpi */
async function makePdf(){
  const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true}),k=300/25.4;
  await loadFonts();
  for(let i=0;i<pages.length;i++){
    if(i)doc.addPage();
    const c=document.createElement('canvas');c.width=Math.round(PW*k);c.height=Math.round(PH*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';
    pages[i].items.forEach(it=>{
      const w=bw(it),h=bh(it);x.save();x.translate(it.x*k,it.y*k);x.rotate(it.rot*Math.PI/180);
      if(it.t)drawText(x,it,k);
      else{x.beginPath();x.rect(-w*k/2,-h*k/2,w*k,h*k);x.clip();
      x.drawImage(assets[it.a].im,(-w/2-it.cl)*k,(-h/2-it.ct)*k,it.W*k,it.H*k)}
      x.restore();
    });
    doc.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,PW,PH);
    await new Promise(r=>setTimeout(r,0));
  }
  return doc.output('blob');
}
$('pdf').onclick=async()=>{
  if(!pages.some(p=>p.items.length)){toast('Сначала добавьте фото или текст');return}
  if(!window.jspdf){toast('Не загрузилась библиотека PDF. Обновите страницу.');return}
  const b=$('pdf');b.disabled=true;toast('Готовлю PDF…');
  try{
    const blob=await makePdf();let dl=null;
    try{dl=window.claude?await window.claude.use('downloads'):null}catch(_){}
    if(dl)await dl.save({filename:'photos-a4.pdf',data:blob});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='photos-a4.pdf';a.click()}
    toast('PDF готов');
  }catch(err){toast(err&&err.code==='declined'?'Сохранение отменено':'Не удалось сохранить PDF')}
  b.disabled=false;
};

async function loadFonts(){
  const L=[];pages.forEach(p=>p.items.forEach(it=>{if(it.t)L.push(document.fonts.load(`${it.itl?'italic ':''}${it.bd?700:400} 40px "${it.font}"`,it.txt||'A').catch(()=>0))}));
  await Promise.race([Promise.all(L),new Promise(r=>setTimeout(r,6000))]);

function drawText(x,it,k){
  const fs=it.fs*k,lh=fs*(it.lh||120)/100,sx=(it.sx||100)/100,ls=(it.ls||0)/100*fs,ws=(it.ws||0)/100*fs,W=it.W*k/sx;
  x.font=`${it.itl?'italic ':''}${it.bd?700:400} ${fs}px "${it.font}",sans-serif`;
  x.fillStyle=it.col;x.textBaseline='alphabetic';x.textAlign=it.al==='l'?'left':it.al==='r'?'right':'center';
  const sp=!!(ls||ws);
  const adv=t=>{if(!sp)return x.measureText(t).width;let w=0;for(const ch of t)w+=x.measureText(ch).width+ls+(ch===' '?ws:0);return w};
  const m=x.measureText('Hg'),asc=m.fontBoundingBoxAscent??fs*.8,dsc=m.fontBoundingBoxDescent??fs*.2;
  const lines=[];
  for(const par of it.txt.split('\n')){
    let cur='';
    for(const wd of par.split(' ')){
      const t=cur?cur+' '+wd:wd;
      if(adv(t)<=W){cur=t;continue}
      if(cur){lines.push(cur);cur=''}
      if(adv(wd)<=W){cur=wd;continue}
      for(const ch of wd){if(cur&&adv(cur+ch)>W){lines.push(cur);cur=ch}else cur+=ch}
    }
    lines.push(cur);
  }
  const top=-lines.length*lh/2,px=it.al==='l'?-W/2:it.al==='r'?W/2:0;
  x.save();x.scale(sx,1);
  lines.forEach((s,n)=>{
    const y=top+n*lh+(lh-asc-dsc)/2+asc;
    if(!sp){x.fillText(s,px,y);return}
    const tot=adv(s);let cx=it.al==='l'?px:it.al==='r'?px-tot:px-tot/2;
    x.textAlign='left';
    for(const ch of s){x.fillText(ch,cx,y);cx+=x.measureText(ch).width+ls+(ch===' '?ws:0)}
  });
  x.restore();
}
